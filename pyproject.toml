[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newsradar-msse"
version = "1.0.0"
description = "Recherche quantitative : actualités crypto + microstructure du carnet d'ordres, à la recherche d'un edge mesurable net de frais."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Enzo-LIBOÏ" }]
keywords = ["crypto", "market-microstructure", "order-book", "news", "quantitative-research", "backtesting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "websockets>=12.0",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    # >=1.6 : models/calibration.py utilise sklearn.frozen.FrozenEstimator.
    # <1.9 : scikit-learn 1.9 plante sur une colonne entièrement vide dans
    # HistGradientBoostingClassifier (6 tests de models/tree_model.py).
    "scikit-learn>=1.6,<1.9",
    "statsmodels>=0.14",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "SQLAlchemy>=2.0",
    "loguru>=0.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "python-telegram-bot>=21.0",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[project.urls]
Repository = "https://github.com/Lxboi/NewsRadar_MSSE"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
