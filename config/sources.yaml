rss_feeds:
  # Phase 5: RSS is the simplest, most reliable, lowest-ToS-risk source
  # (section 72). Expanded 2026-08-18 per the user's request to maximize
  # source coverage within Pi 5 4GB hardware limits — research concluded
  # that feed *count* is not the real constraint on a Pi 5 4GB (a poll is a
  # transient fetch/parse/discard, no persistent connection or heavy state);
  # the actual risks are concurrent-connection bursts and heavy NLP/ML
  # dependencies, both addressed via `rss_polling` below and the lexicon-
  # based (not transformer-based) sentiment scorer in src/news/sentiment.py.
  # 16 crypto-media feeds + 8 official regulatory/macro feeds = 24 total.

  # --- Crypto media (16) ---
