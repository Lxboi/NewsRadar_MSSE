rss_polling:
  # Hardware-conscious defaults for a Raspberry Pi 5 4GB (section 63): the
  # constraint isn't feed count, it's avoiding a thundering herd of
  # simultaneous connections and keeping per-feed memory flat over a long
  # run. Each feed polls independently (fault isolation, section 10);
  # max_concurrent_fetches caps how many of the 24 are ever in-flight at once.
  poll_interval_s: 60           # per feed; actual interval is +/- jitter_s
  jitter_s: 15                  # staggers both the first poll and every repeat
  max_concurrent_fetches: 5     # hard cap on simultaneous HTTP GETs across all feeds
  http_timeout_s: 10
  user_agent: "crypto_radar-research-bot/0.5 (personal research project; RESEARCH mode only)"

google_news:
  enabled: false            # 2026-08-18 decision: kept disabled — the unofficial
  # news.google.com/rss/search endpoint's robots.txt disallows automated
  # fetching, which conflicts with this file's own rate_limits below
  # (respect_robots_txt / never_bypass_anti_bot). Revisit only if an
  # official/compliant alternative is found.
  language: "en"
  region: "US"
  poll_interval_s: 30

social:
  enabled: false            # off by default per section 20 — API + ToS gated.
  # 2026-08-18 decision: deferred, not implemented this phase.
  #   - X/Twitter: no free API tier exists (paid, ~$35-50+/month minimum).
  #   - Reddit: free tier exists but now requires an approval application
  #     ("Responsible Builder Policy", since June 2026) before API keys are
  #     issued — an external process, not just a config change.
  # Revisit once the user has made those calls independently of hardware.
  twitter:
    enabled: false
    accounts: []
  reddit:
    enabled: false
    subreddits: []

rate_limits:
  default_requests_per_minute: 30
  respect_robots_txt: true
  never_bypass_anti_bot: true   # hard rule, section 20 — not a suggestion

deduplication:
  # Section 22
  title_similarity_threshold: 0.85
  time_window_s: 900             # articles within 15 min sharing a source are candidates
  use_semantic_similarity: false  # flip on once an embedding model is chosen in Phase 5

decay:
  # Section 25 — half-lives to test empirically, not assumed correct.
  half_life_candidates_s: [30, 60, 300, 900, 3600]
  default_half_life_s: 300
