# =============================================================================
# sources.yaml — news / search radar configuration
# Sections 20-22: keywords must be configurable here, never hardcoded.
# Respect official APIs, rate limits, ToS, robots.txt — no anti-bot bypass.
# =============================================================================

keywords:
  - "Bitcoin"
  - "BTC"
  - "Ethereum"
  - "ETH"
  - "Solana"
  - "SOL"
  - "ETF"
  - "SEC"
  - "Fed"
  - "FOMC"
  - "CPI"
  - "inflation"
  - "interest rates"
  - "liquidation"
  - "hack"
  - "exploit"
  - "exchange"
  - "Kraken"
  - "Coinbase"
  - "Binance"
  - "BlackRock"
  - "regulation"
  - "stablecoin"
